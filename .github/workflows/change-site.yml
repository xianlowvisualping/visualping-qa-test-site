# Make changes to the QA test site from the GitHub UI (Actions > Change test site
# > Run workflow) or with:
#   gh workflow run change-site.yml -f commands="price 24.99; stock out"
#
# Who can run it: only people with write access to this repo, and the first
# step then fails (red) unless the run was started by the repo owner.
#
# Security notes:
# - Inputs reach the shell only through environment variables, never through
#   ${{ }} inside `run:`, so they can't inject shell code. change.py parses the
#   commands with shlex and runs no shell itself.
# - The built-in GITHUB_TOKEN is used, limited to `contents: write` for this job.
#   No personal access token or other secret is needed or stored.
# - Third-party actions are pinned to a full commit SHA.
# - Run inputs and logs are PUBLIC. Use only test values: never a customer
#   name, URL or email.
name: Change test site

on:
  workflow_dispatch:
    inputs:
      commands:
        description: 'One or more changes, separated by ";" (e.g. price 24.99; stock out). PUBLIC: test values only.'
        type: string
        required: true
        default: touch
      sandbox:
        description: Optional sandbox name, to change only /t/NAME/ (create it first with sandbox-create NAME)
        type: string
        required: false
        default: ""
      wait_for_live:
        description: Wait until every changed file is live (after GitHub's ~10 minute cache)
        type: boolean
        default: true

permissions: {}

concurrency:
  group: change-test-site
  cancel-in-progress: false

jobs:
  change:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Only the repo owner may change the site
        env:
          ACTOR: ${{ github.triggering_actor }}
        run: |
          if [ "$ACTOR" != "xianlowvisualping" ]; then
            echo "::error::Run started by '$ACTOR'. Only xianlowvisualping may change the test site."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply changes, commit and push
        env:
          COMMANDS: ${{ inputs.commands }}
          SANDBOX: ${{ inputs.sandbox }}
        run: |
          opts=(--summary "$GITHUB_STEP_SUMMARY")
          if [ -n "$SANDBOX" ]; then opts+=(--in "$SANDBOX"); fi
          # "--" stops the commands text being read as options.
          python3 change.py "${opts[@]}" -- run "$COMMANDS"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs site-state.json
          git commit --quiet -m "QA change via workflow run $GITHUB_RUN_NUMBER"

          pushed=""
          for attempt in 1 2 3; do
            if git pull --rebase --quiet && git push --quiet; then pushed=1; break; fi
            sleep 5
          done
          if [ -z "$pushed" ]; then echo "::error::Could not push after 3 attempts."; exit 1; fi
          echo "Commit: \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait until every changed file is live
        if: inputs.wait_for_live
        run: python3 verify_live.py --timeout-minutes 20 --summary "$GITHUB_STEP_SUMMARY"
