<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Visualping QA Test Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-blue">
  <header>
    <p class="tag">QA test page &middot; not a real store</p>
    <h1 id="headline">Acme Test Store</h1>
    <p id="announcement">Welcome! This page exists only for Visualping QA testing.</p>
  </header>

  <main>
    <section class="card" id="product">
      <h2>Test Widget</h2>
      <p class="price">$<span id="price">19.99</span></p>
      <p id="stock" class="stock in">In stock</p>
    </section>

    <section class="card" id="news">
      <h2>Latest news</h2>
      <ul id="news-list">
        <li>Store opened for testing</li>
        <li>Free shipping on all test orders</li>
      </ul>
    </section>
  </main>

  <footer>
    <p>Change #<span id="change-number">1</span>
       &middot; Last updated <time id="last-updated">2026-11-05 17:26 UTC</time>
       &middot; Theme: <span id="theme">blue</span></p>
  </footer>
</body>
</html>
